apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-dashboard-backend
  namespace: devsecops
  labels:
    app: devsecops-dashboard-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-dashboard-backend
  template:
    metadata:
      labels:
        app: devsecops-dashboard-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: riahiamani/devsecops-dashboard-backend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
            - name: FRONTEND_ORIGIN
              value: "https://dashboard.riahi.dpdns.org"
            - name: LOKI_URL
              value: "http://loki.monitoring.svc.cluster.local:3100"
            - name: JENKINS_URL
              value: "http://jenkins-service.jenkins.svc.cluster.local:8080"
            - name: JENKINS_PUBLIC_URL
              value: "https://jenkins.riahi.dpdns.org"
            - name: SONARCLOUD_PROJECT_KEY
              value: "RiahiAmani_flask-postgres-docker-compose"
            - name: SONARCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonarcloud-dashboard-credentials
                  key: token
            - name: GRAFANA_FALCO_URL
              value: "https://grafana.riahi.dpdns.org/d/ad5hblk/logs-centralises-e28094-devsecops?orgId=1&timezone=browser&var-namespace=falco&from=now-1h&to=now"
            - name: JENKINS_JOB
              value: "taskmanager"
            - name: JENKINS_USER
              valueFrom:
                secretKeyRef:
                  name: jenkins-api-credentials
                  key: username
            - name: JENKINS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jenkins-api-credentials
                  key: token
            - name: CLOUDFLARED_METRICS_URL
              value: "http://cloudflared-metrics.cloudflared.svc.cluster.local:20241"
            - name: GRAFANA_URL
              value: "http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local"
            - name: GRAFANA_PUBLIC_URL
              value: "https://grafana.riahi.dpdns.org"
            - name: GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-api-token
                  key: token
            
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-dashboard-backend
  namespace: devsecops
  labels:
    app: devsecops-dashboard-backend
spec:
  selector:
    app: devsecops-dashboard-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-dashboard-frontend
  namespace: devsecops
  labels:
    app: devsecops-dashboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-dashboard-frontend
  template:
    metadata:
      labels:
        app: devsecops-dashboard-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: riahiamani/devsecops-dashboard-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-dashboard-frontend-service
  namespace: devsecops
  labels:
    app: devsecops-dashboard-frontend
spec:
  selector:
    app: devsecops-dashboard-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-dashboard-ingress
  namespace: devsecops
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.riahi.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devsecops-dashboard-frontend-service
                port:
                  number: 80
