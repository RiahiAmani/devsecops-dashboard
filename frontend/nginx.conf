server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://devsecops-dashboard-backend.devsecops.svc.cluster.local:5000/api/;
        proxy_set_header Host $host;
    }
}
